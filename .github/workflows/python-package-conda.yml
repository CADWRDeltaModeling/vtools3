name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: ""
        auto-activate-base: false
        channels: conda-forge
        conda-remove-defaults: true
    - name: Conda build package and upload to anaconda.org
      env: 
        ANACONDA_CHANNEL_UPLOAD_TOKEN: ${{ secrets.ANACONDA_CHANNEL_UPLOAD_TOKEN }}
      run: |
        conda create -n test_vtools3 -y python=3.12 conda-build conda-verify numpy anaconda-client setuptools-scm
        conda config --set anaconda_upload yes
        SETUPTOOLS_SCM_PRETEND_VERSION=$(conda run -n test_vtools3 python -m setuptools_scm)
        export SETUPTOOLS_SCM_PRETEND_VERSION
        conda run -n test_vtools3 --no-capture-output conda-build -c cadwr-dms -c conda-forge --user cadwr-dms --token "$ANACONDA_CHANNEL_UPLOAD_TOKEN" conda.recipe
        conda remove -n test_vtools3 --all -y
